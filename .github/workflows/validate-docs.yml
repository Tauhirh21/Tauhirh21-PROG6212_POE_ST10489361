name: Validate Part 1 Documents

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check /docs folder exists
      run: |
        if [ -d "docs" ]; then
          echo "✅ docs folder found!"
        else
          echo "❌ Error: /docs folder not found!"
          exit 1
        fi

    - name: Check ERD file exists (PNG or PDF)
      run: |
        echo "Looking for PNG/PDF files in docs..."
        ls -la docs/
        if find docs/ -maxdepth 1 -type f \( -name "*.png" -o -name "*.pdf" \) | grep -q .; then
          echo "✅ ERD file found!"
        else
          echo "❌ Error: No ERD image (PNG/PDF) found in /docs"
          exit 1
        fi

    - name: Check endpoint plan exists (MD or PDF)
      run: |
        echo "Looking for MD/PDF files in docs..."
        ls -la docs/
        if find docs/ -maxdepth 1 -type f \( -name "*.md" -o -name "*.pdf" \) | grep -q .; then
          echo "✅ Endpoint plan found!"
        else
          echo "❌ Error: No endpoint plan (MD/PDF) found in /docs"
          exit 1
        fi

    - name: Check SQL script exists
      run: |
        echo "Looking for SQL files in docs..."
        ls -la docs/
        if find docs/ -maxdepth 1 -type f -name "*.sql" | grep -q .; then
          echo "✅ SQL script found!"
        else
          echo "❌ Error: No SQL script found in /docs"
          exit 1
        fi

    - name: All checks passed
      run: echo "✅ All required Part 1 documents are present!"